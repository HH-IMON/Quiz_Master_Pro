<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Quiz Master Pro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: var(--spacing-2xl);
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .auth-logo {
            font-size: 4rem;
            margin-bottom: var(--spacing-md);
        }

        .auth-title {
            font-size: 2rem;
            margin-bottom: var(--spacing-sm);
        }

        .auth-subtitle {
            color: var(--text-muted);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin: var(--spacing-xl) 0;
            background: rgba(0, 0, 0, 0.1);
        }

        .auth-footer {
            text-align: center;
            margin-top: var(--spacing-xl);
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--secondary-end);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.25rem;
        }

        .back-link {
            position: absolute;
            top: var(--spacing-xl);
            left: var(--spacing-xl);
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <div class="animated-bg"></div>
    <div class="particles"></div>

    <a href="/" class="back-link">← Back to Home</a>

    <div class="auth-container">
        <div class="glass-card auth-card animate-slide-up">
            <div class="auth-header">
                <div class="auth-logo">🎓</div>
                <div class="title-box">
                    <h1 class="auth-title gradient-text" style="margin-bottom: 0;">Welcome Back!</h1>
                </div>
                <p class="auth-subtitle">Sign in to continue your learning journey</p>
            </div>

            <form id="login-form" data-portal="client">
                <div class="form-group">
                    <label class="form-label">Username or Email</label>
                    <input type="text" name="username" class="form-input" placeholder="Enter your username or email"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" name="password" class="form-input" placeholder="Enter your password"
                            required>
                        <button type="button" class="password-toggle"
                            onclick="togglePasswordVisibility(this)">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-full mt-lg">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/client/register">Sign Up</a></p>
            </div>

            <div class="auth-divider">or</div>

            <a href="/server/login" class="btn btn-glass w-full">
                Teacher/Admin Login →
            </a>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
</body>

</html>
