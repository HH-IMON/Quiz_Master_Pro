<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Quiz Master Pro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
</head>

<body>
    <div class="animated-bg"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="/client/home" class="sidebar-brand">
            <span>🧠</span>
            <span>Quiz Master Pro</span>
        </a>

        <nav>
            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a href="/client/home" class="sidebar-nav-link">
                        <span class="icon">🏠</span>
                        <span>Home</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/client/practice" class="sidebar-nav-link">
                        <span class="icon">📚</span>
                        <span>Practice</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/client/battle" class="sidebar-nav-link">
                        <span class="icon">⚔️</span>
                        <span>Battle</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/client/chat" class="sidebar-nav-link active">
                        <span class="icon">💬</span>
                        <span>Chat</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div style="margin-top: auto; padding-top: var(--spacing-xl);">
            <button class="btn btn-glass w-full logout-btn">🚪 Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" style="padding: var(--spacing-lg);">
        <div class="chat-container">
            <!-- Chat Rooms Sidebar -->
            <div class="chat-sidebar">
                <div class="chat-sidebar-header">
                    <h3 class="chat-sidebar-title">💬 Chat Rooms</h3>
                </div>
                <div class="room-list" id="room-list">
                    <!-- Rooms loaded dynamically -->
                </div>
            </div>

            <!-- Chat Main Area -->
            <div class="chat-main">
                <div class="chat-header">
                    <div class="chat-title">
                        <h3 id="current-room-name">Select a room</h3>
                        <div class="online-count">
                            <span class="online-dot"></span>
                            <span>0 online</span>
                        </div>
                    </div>
                </div>

                <div class="messages-container" id="messages-container">
                    <div class="text-center opacity-75" style="margin-top: 40%;">
                        <div style="font-size: 4rem;">💬</div>
                        <p class="mt-lg">Select a chat room to start messaging</p>
                    </div>
                </div>

                <div class="chat-input-container">
                    <div class="message-type-toggle">
                        <button class="type-btn active" data-type="text">💬 Text</button>
                        <button class="type-btn" data-type="question">❓ Question</button>
                        <button class="type-btn" data-type="answer">💡 Answer</button>
                    </div>

                    <div class="chat-input-wrapper mt-md">
                        <textarea id="chat-input" class="chat-textarea" placeholder="Type your message..."
                            rows="1"></textarea>
                        <button id="send-btn" class="send-btn">➤</button>
                    </div>
                </div>
            </div>

            <!-- Online Users Panel -->
            <div class="online-users-panel">
                <div class="online-users-header">
                    <h4 class="online-users-title">Online Users</h4>
                </div>
                <div class="online-users-list" id="online-users-list">
                    <!-- Users loaded dynamically -->
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/client/chat.js"></script>
</body>

</html>
