<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Quiz Master Pro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/game.css">
</head>

<body>
    <div class="animated-bg"></div>
    <div class="particles"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="/client/home" class="sidebar-brand">
            <span>🧠</span>
            <span>Quiz Master Pro</span>
        </a>

        <nav>
            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a href="/client/home" class="sidebar-nav-link">
                        <span class="icon">🏠</span>
                        <span>Home</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/client/game" class="sidebar-nav-link">
                        <span class="icon">🎮</span>
                        <span>Join Game</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/client/practice" class="sidebar-nav-link">
                        <span class="icon">📚</span>
                        <span>Practice</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/client/leaderboard" class="sidebar-nav-link active">
                        <span class="icon">🏆</span>
                        <span>Leaderboard</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div style="margin-top: auto; padding-top: var(--spacing-xl);">
            <button class="btn btn-glass w-full logout-btn">🚪 Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="text-center mb-xl">
            <h1 class="gradient-text">🏆 Global Leaderboard</h1>
            <p class="opacity-75">See who's leading the way!</p>
        </header>

        <!-- Top 3 Podium -->
        <div class="flex justify-center gap-xl mb-2xl" id="top-3">
            <!-- Top 3 will be loaded here -->
        </div>

        <!-- Rest of Leaderboard -->
        <div class="glass-card" style="max-width: 800px; margin: 0 auto;">
            <div id="leaderboard-list">
                <p class="text-center opacity-75 p-xl">Loading leaderboard...</p>
            </div>
        </div>

        <!-- Your Rank -->
        <div class="glass-card mt-xl text-center" style="max-width: 400px; margin: var(--spacing-xl) auto 0;">
            <h3 class="mb-md">Your Rank</h3>
            <div id="my-rank">
                <p class="opacity-75">Loading...</p>
            </div>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        async function init() {
            await getCurrentUser();
            loadLeaderboard();
        }

        async function loadLeaderboard() {
            try {
                const result = await api.get('/admin/leaderboard?limit=50');
                const leaderboard = result.leaderboard || [];

                renderTop3(leaderboard.slice(0, 3));
                renderLeaderboard(leaderboard.slice(3));

                // Find my rank
                if (currentUser) {
                    const myIndex = leaderboard.findIndex(p => p.id === currentUser.id);
                    if (myIndex !== -1) {
                        renderMyRank(myIndex + 1, leaderboard[myIndex]);
                    } else {
                        document.getElementById('my-rank').innerHTML = `
                            <p class="opacity-75">Not ranked yet. Start playing to earn XP!</p>
                        `;
                    }
                }
            } catch (error) {
                showToast('Failed to load leaderboard', 'error');
            }
        }

        function renderTop3(top3) {
            const container = document.getElementById('top-3');

            if (top3.length < 3) {
                container.innerHTML = '';
                return;
            }

            const order = [1, 0, 2]; // Show 2nd, 1st, 3rd in that order (1st in the middle)
            const heights = ['180px', '220px', '150px'];
            const badges = ['🥈', '🥇', '🥉'];
            const colors = ['var(--secondary-end)', 'var(--accent-gold)', 'var(--neutral-500)'];

            container.innerHTML = order.map((idx, i) => {
                const player = top3[idx];
                if (!player) return '';

                return `
                    <div class="glass-card text-center animate-slide-up" 
                         style="padding: var(--spacing-xl); min-width: 200px; height: ${heights[i]}; display: flex; flex-direction: column; justify-content: flex-end;">
                        <div style="font-size: 3rem; margin-bottom: var(--spacing-sm);">${badges[i]}</div>
                        <div class="avatar avatar-lg" style="margin: 0 auto; border: 3px solid ${colors[i]};">
                            ${getAvatarEmoji(player.avatar)}
                        </div>
                        <h4 class="mt-md">${escapeHtml(player.username)}</h4>
                        <div class="badge badge-primary mt-sm">
                            ${player.rank_badge} Lvl ${player.level}
                        </div>
                        <div class="stat-value mt-md" style="font-size: 1.5rem;">${player.xp_points}</div>
                        <div class="stat-label">XP</div>
                    </div>
                `;
            }).join('');
        }

        function renderLeaderboard(players) {
            const container = document.getElementById('leaderboard-list');

            if (players.length === 0) {
                container.innerHTML = '<p class="text-center opacity-75 p-lg">No other players yet</p>';
                return;
            }

            container.innerHTML = `
                <ul class="leaderboard-list">
                    ${players.map((player, i) => `
                        <li class="leaderboard-item ${player.id === currentUser?.id ? 'highlighted' : ''}">
                            <div class="leaderboard-position">${i + 4}</div>
                            <div class="leaderboard-info">
                                <div class="avatar avatar-sm">${getAvatarEmoji(player.avatar)}</div>
                                <div>
                                    <span class="leaderboard-name">${escapeHtml(player.username)}</span>
                                    <div class="badge badge-glass" style="font-size: 0.7rem; padding: 2px 6px;">
                                        ${player.rank_badge} Lvl ${player.level}
                                    </div>
                                </div>
                            </div>
                            <div class="leaderboard-score">${player.xp_points} XP</div>
                        </li>
                    `).join('')}
                </ul>
            `;
        }

        function renderMyRank(rank, player) {
            document.getElementById('my-rank').innerHTML = `
                <div class="flex items-center justify-center gap-lg">
                    <div class="stat-value" style="font-size: 2.5rem;">#${rank}</div>
                    <div>
                        <div class="avatar">${getAvatarEmoji(player.avatar)}</div>
                    </div>
                    <div class="text-left">
                        <div class="font-bold">${player.xp_points} XP</div>
                        <div class="badge badge-primary">${player.rank_badge} Level ${player.level}</div>
                    </div>
                </div>
            `;
        }

        init();
    </script>

    <style>
        .leaderboard-item.highlighted {
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid var(--primary-start);
        }
    </style>
</body>

</html>
