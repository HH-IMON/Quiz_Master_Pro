<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Quiz Master Pro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            padding: var(--spacing-2xl);
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .auth-logo {
            font-size: 4rem;
            margin-bottom: var(--spacing-md);
        }

        .auth-title {
            font-size: 2rem;
            margin-bottom: var(--spacing-sm);
        }

        .auth-subtitle {
            color: var(--text-muted);
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: var(--spacing-sm);
            margin-top: var(--spacing-sm);
        }

        .avatar-option {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.05);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 1.5rem;
        }

        .avatar-option:hover {
            background: rgba(0, 0, 0, 0.1);
            transform: scale(1.1);
        }

        .avatar-option.selected {
            border-color: var(--primary-start);
            background: rgba(102, 126, 234, 0.3);
        }

        .auth-footer {
            text-align: center;
            margin-top: var(--spacing-xl);
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--secondary-end);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link {
            position: absolute;
            top: var(--spacing-xl);
            left: var(--spacing-xl);
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.25rem;
        }
    </style>
</head>

<body>
    <div class="animated-bg"></div>
    <div class="particles"></div>

    <a href="/" class="back-link">← Back to Home</a>

    <div class="auth-container">
        <div class="glass-card auth-card animate-slide-up">
            <div class="auth-header">
                <div class="auth-logo">🚀</div>
                <h1 class="auth-title gradient-text">Join the Fun!</h1>
                <p class="auth-subtitle">Create your free account and start learning</p>
            </div>

            <form id="register-form">
                <input type="hidden" name="avatar" value="avatar1">

                <div class="form-group">
                    <label class="form-label">Choose Your Avatar</label>
                    <div class="avatar-grid"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" placeholder="Choose a cool username" required
                        minlength="3">
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" name="password" class="form-input" placeholder="Create a strong password"
                            required minlength="6">
                        <button type="button" class="password-toggle"
                            onclick="togglePasswordVisibility(this)">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" name="confirmPassword" class="form-input"
                            placeholder="Confirm your password" required>
                        <button type="button" class="password-toggle"
                            onclick="togglePasswordVisibility(this)">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-full mt-lg">
                    Create Account 🎉
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/client/login">Sign In</a></p>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
</body>

</html>
