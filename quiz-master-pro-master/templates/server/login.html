<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher/Admin Login - Quiz Master Pro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: var(--spacing-2xl);
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .auth-logo {
            font-size: 4rem;
            margin-bottom: var(--spacing-md);
        }

        .auth-title {
            font-size: 2rem;
            margin-bottom: var(--spacing-sm);
        }

        .auth-subtitle {
            color: var(--text-muted);
        }

        .auth-footer {
            text-align: center;
            margin-top: var(--spacing-xl);
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--secondary-end);
            text-decoration: none;
            font-weight: 600;
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.25rem;
        }

        .back-link {
            position: absolute;
            top: var(--spacing-xl);
            left: var(--spacing-xl);
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .server-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid var(--primary-start);
            border-radius: var(--radius-xl);
            font-size: 0.875rem;
            margin-bottom: var(--spacing-lg);
        }
    </style>
</head>

<body>
    <div class="animated-bg"></div>
    <div class="particles"></div>

    <a href="/" class="back-link">← Back to Home</a>

    <div class="auth-container">
        <div class="glass-card auth-card animate-slide-up">
            <div class="auth-header">
                <div class="auth-logo">📊</div>
                <span class="server-badge">🖥️ Server Portal</span>
                <h1 class="auth-title gradient-text">Teacher/Admin Access</h1>
                <p class="auth-subtitle">Manage quizzes and host games</p>
            </div>

            <form id="login-form" data-portal="server">
                <div class="form-group">
                    <label class="form-label">Username or Email</label>
                    <input type="text" name="username" class="form-input" placeholder="Enter your credentials" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" name="password" class="form-input" placeholder="Enter your password"
                            required>
                        <button type="button" class="password-toggle"
                            onclick="togglePasswordVisibility(this)">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-full mt-lg">
                    Access Dashboard
                </button>
            </form>

            <div class="auth-footer">
                <p>Student? <a href="/client/login">Use Student Portal</a></p>
            </div>

            <div class="alert alert-info mt-xl">
                <span>💡</span>
                <span>Default admin: <strong>admin</strong> / <strong>******</strong></span>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
</body>

</html>
