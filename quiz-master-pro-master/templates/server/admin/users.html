<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Quiz Master Pro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="animated-bg"></div>
    <div class="particles"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="/server/dashboard" class="sidebar-brand">
            <span>🧠</span>
            <span>Quiz Master Pro</span>
        </a>

        <div class="badge badge-danger mb-xl" style="width: 100%; justify-content: center;">
            👑 Admin Portal
        </div>

        <nav>
            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a href="/server/dashboard" class="sidebar-nav-link">
                        <span class="icon">📊</span>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/server/admin/users" class="sidebar-nav-link active">
                        <span class="icon">👥</span>
                        <span>Manage Users</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/server/admin/quizzes" class="sidebar-nav-link">
                        <span class="icon">📝</span>
                        <span>All Quizzes</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/server/admin/categories" class="sidebar-nav-link">
                        <span class="icon">📁</span>
                        <span>Categories</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div style="margin-top: auto;">
            <button class="btn btn-glass w-full logout-btn">🚪 Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="flex justify-between items-center mb-xl">
            <div>
                <h1 class="gradient-text">Manage Users</h1>
                <p class="opacity-75">View and manage all platform users</p>
            </div>
            <button class="btn btn-primary" onclick="showModal('add-user-modal')">
                + Add User
            </button>
        </header>

        <!-- Filters -->
        <div class="glass-card mb-xl">
            <div class="grid grid-4">
                <div class="form-group" style="margin: 0;">
                    <label class="form-label">Role</label>
                    <select id="filter-role" class="form-input form-select" onchange="loadUsers()">
                        <option value="">All Roles</option>
                        <option value="student">Students</option>
                        <option value="teacher">Teachers</option>
                        <option value="admin">Admins</option>
                    </select>
                </div>
                <div class="form-group" style="margin: 0;">
                    <label class="form-label">Status</label>
                    <select id="filter-status" class="form-input form-select" onchange="loadUsers()">
                        <option value="">All Status</option>
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>
                </div>
                <div class="form-group" style="margin: 0;">
                    <label class="form-label">Search</label>
                    <input type="text" id="search-input" class="form-input" placeholder="Search by name or email..."
                        oninput="filterUsers()">
                </div>
                <div class="form-group" style="margin: 0; display: flex; align-items: flex-end;">
                    <button class="btn btn-glass w-full" onclick="clearFilters()">Clear</button>
                </div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="glass-card">
            <div class="card-header">
                <h3 class="card-title">Users</h3>
                <span class="badge badge-glass" id="user-count">0 users</span>
            </div>

            <div id="users-list">
                <p class="text-center opacity-75 p-xl">Loading users...</p>
            </div>
        </div>
    </main>

    <!-- Add User Modal -->
    <div class="modal-overlay" id="add-user-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Add New User</h3>
                <button class="modal-close" onclick="hideModal('add-user-modal')">×</button>
            </div>

            <form id="add-user-form">
                <div class="form-group">
                    <label class="form-label">Username *</label>
                    <input type="text" name="username" class="form-input" required minlength="3">
                </div>

                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input type="email" name="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" class="form-input" required minlength="6">
                </div>

                <div class="form-group">
                    <label class="form-label">Role *</label>
                    <select name="role" class="form-input form-select" required>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-full">Create User</button>
            </form>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal-overlay" id="edit-user-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Edit User</h3>
                <button class="modal-close" onclick="hideModal('edit-user-modal')">×</button>
            </div>

            <form id="edit-user-form">
                <input type="hidden" name="user_id" id="edit-user-id">

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" id="edit-username" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" id="edit-email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select name="role" id="edit-role" class="form-input form-select">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select name="is_active" id="edit-status" class="form-input form-select">
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-full">Update User</button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        let allUsers = [];

        async function init() {
            const user = await getCurrentUser();
            if (!user || user.role !== 'admin') {
                window.location.href = '/server/login';
                return;
            }

            loadUsers();
        }

        async function loadUsers() {
            const role = document.getElementById('filter-role').value;
            const status = document.getElementById('filter-status').value;

            try {
                let url = '/admin/users?';
                if (role) url += `role=${role}&`;
                if (status !== '') url += `is_active=${status}&`;

                const result = await api.get(url);
                allUsers = result.users || [];

                document.getElementById('user-count').textContent = `${allUsers.length} users`;
                renderUsers(allUsers);
            } catch (error) {
                showToast('Failed to load users', 'error');
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('users-list');

            if (users.length === 0) {
                container.innerHTML = '<p class="text-center opacity-75 p-xl">No users found</p>';
                return;
            }

            container.innerHTML = `
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Level</th>
                                <th>XP</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${users.map(user => `
                                <tr>
                                    <td>
                                        <div class="flex items-center gap-md">
                                            <div class="avatar avatar-sm">${getAvatarEmoji(user.avatar)}</div>
                                            <strong>${escapeHtml(user.username)}</strong>
                                        </div>
                                    </td>
                                    <td>${escapeHtml(user.email)}</td>
                                    <td>
                                        <span class="badge badge-${user.role === 'admin' ? 'danger' : user.role === 'teacher' ? 'warning' : 'primary'}">
                                            ${user.role}
                                        </span>
                                    </td>
                                    <td>${user.rank_badge || ''} Lvl ${user.level || 1}</td>
                                    <td>${user.xp_points || 0}</td>
                                    <td>
                                        <span class="badge ${user.is_active ? 'badge-success' : 'badge-danger'}">
                                            ${user.is_active ? 'Active' : 'Inactive'}
                                        </span>
                                    </td>
                                    <td>
                                        <div class="flex gap-sm">
                                            <button class="btn btn-glass btn-sm" onclick="editUser(${user.id})">Edit</button>
                                            ${user.role !== 'admin' ? `
                                                <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})">Delete</button>
                                            ` : ''}
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function filterUsers() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const filtered = allUsers.filter(u =>
                u.username.toLowerCase().includes(search) ||
                u.email.toLowerCase().includes(search)
            );
            renderUsers(filtered);
        }

        function clearFilters() {
            document.getElementById('filter-role').value = '';
            document.getElementById('filter-status').value = '';
            document.getElementById('search-input').value = '';
            loadUsers();
        }

        // Add user form
        document.getElementById('add-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = getFormData('add-user-form');

            try {
                await api.post('/auth/register', formData);
                showToast('User created!', 'success');
                hideModal('add-user-modal');
                e.target.reset();
                loadUsers();
            } catch (error) {
                showToast(error.message || 'Failed to create user', 'error');
            }
        });

        function editUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            document.getElementById('edit-user-id').value = user.id;
            document.getElementById('edit-username').value = user.username;
            document.getElementById('edit-email').value = user.email;
            document.getElementById('edit-role').value = user.role;
            document.getElementById('edit-status').value = user.is_active ? '1' : '0';

            showModal('edit-user-modal');
        }

        // Edit user form
        document.getElementById('edit-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const userId = document.getElementById('edit-user-id').value;
            const data = {
                username: document.getElementById('edit-username').value,
                email: document.getElementById('edit-email').value,
                role: document.getElementById('edit-role').value,
                is_active: document.getElementById('edit-status').value === '1'
            };

            try {
                await api.put(`/admin/users/${userId}`, data);
                showToast('User updated!', 'success');
                hideModal('edit-user-modal');
                loadUsers();
            } catch (error) {
                showToast(error.message || 'Failed to update user', 'error');
            }
        });

        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user? This action cannot be undone.')) return;

            try {
                await api.delete(`/admin/users/${userId}`);
                showToast('User deleted', 'success');
                loadUsers();
            } catch (error) {
                showToast(error.message || 'Failed to delete user', 'error');
            }
        }

        init();
    </script>
</body>

</html>
