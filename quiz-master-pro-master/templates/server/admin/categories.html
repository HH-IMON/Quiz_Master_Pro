<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - Quiz Master Pro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="animated-bg"></div>
    <div class="particles"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="/server/dashboard" class="sidebar-brand">
            <span>🧠</span>
            <span>Quiz Master Pro</span>
        </a>

        <div class="badge badge-danger mb-xl" style="width: 100%; justify-content: center;">
            👑 Admin Portal
        </div>

        <nav>
            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a href="/server/dashboard" class="sidebar-nav-link">
                        <span class="icon">📊</span>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/server/admin/users" class="sidebar-nav-link">
                        <span class="icon">👥</span>
                        <span>Manage Users</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/server/admin/categories" class="sidebar-nav-link active">
                        <span class="icon">📁</span>
                        <span>Categories</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div style="margin-top: auto;">
            <button class="btn btn-glass w-full logout-btn">🚪 Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="flex justify-between items-center mb-xl">
            <div>
                <h1 class="gradient-text">Manage Categories</h1>
                <p class="opacity-75">Organize quizzes into categories</p>
            </div>
            <button class="btn btn-primary" onclick="showModal('add-category-modal')">
                + Add Category
            </button>
        </header>

        <!-- Categories Grid -->
        <div class="grid grid-4" id="categories-grid">
            <p class="opacity-75">Loading categories...</p>
        </div>
    </main>

    <!-- Add Category Modal -->
    <div class="modal-overlay" id="add-category-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Add Category</h3>
                <button class="modal-close" onclick="hideModal('add-category-modal')">×</button>
            </div>

            <form id="add-category-form">
                <div class="form-group">
                    <label class="form-label">Category Name *</label>
                    <input type="text" name="name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Icon (emoji)</label>
                    <input type="text" name="icon" class="form-input" placeholder="📚" maxlength="4">
                </div>

                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-input form-textarea"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-full">Create Category</button>
            </form>
        </div>
    </div>

    <!-- Edit Category Modal -->
    <div class="modal-overlay" id="edit-category-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Edit Category</h3>
                <button class="modal-close" onclick="hideModal('edit-category-modal')">×</button>
            </div>

            <form id="edit-category-form">
                <input type="hidden" name="category_id" id="edit-category-id">

                <div class="form-group">
                    <label class="form-label">Category Name *</label>
                    <input type="text" name="name" id="edit-category-name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Icon (emoji)</label>
                    <input type="text" name="icon" id="edit-category-icon" class="form-input" maxlength="4">
                </div>

                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea name="description" id="edit-category-desc" class="form-input form-textarea"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-full">Update Category</button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        let categories = [];

        async function init() {
            const user = await getCurrentUser();
            if (!user || user.role !== 'admin') {
                window.location.href = '/server/login';
                return;
            }

            loadCategories();
        }

        async function loadCategories() {
            try {
                const result = await api.get('/admin/categories');
                categories = result.categories || [];
                renderCategories();
            } catch (error) {
                showToast('Failed to load categories', 'error');
            }
        }

        function renderCategories() {
            const grid = document.getElementById('categories-grid');

            if (categories.length === 0) {
                grid.innerHTML = `
                    <div class="glass-card text-center" style="grid-column: span 4; padding: var(--spacing-2xl);">
                        <div style="font-size: 4rem;">📁</div>
                        <h3 class="mt-lg">No Categories Yet</h3>
                        <p class="opacity-75 mt-sm">Create your first category to organize quizzes</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = categories.map(cat => `
                <div class="glass-card text-center" style="padding: var(--spacing-xl);">
                    <div style="font-size: 3rem;">${cat.icon || '📁'}</div>
                    <h4 class="mt-md">${escapeHtml(cat.name)}</h4>
                    <p class="opacity-75 mt-sm" style="font-size: 0.875rem;">
                        ${cat.description || 'No description'}
                    </p>
                    <div class="badge badge-glass mt-md">
                        ${cat.quiz_count || 0} quizzes
                    </div>
                    <div class="flex gap-sm justify-center mt-lg">
                        <button class="btn btn-glass btn-sm" onclick="editCategory(${cat.id})">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteCategory(${cat.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Add category form
        document.getElementById('add-category-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = getFormData('add-category-form');

            try {
                await api.post('/admin/categories', formData);
                showToast('Category created!', 'success');
                hideModal('add-category-modal');
                e.target.reset();
                loadCategories();
            } catch (error) {
                showToast(error.message || 'Failed to create category', 'error');
            }
        });

        function editCategory(categoryId) {
            const category = categories.find(c => c.id === categoryId);
            if (!category) return;

            document.getElementById('edit-category-id').value = category.id;
            document.getElementById('edit-category-name').value = category.name;
            document.getElementById('edit-category-icon').value = category.icon || '';
            document.getElementById('edit-category-desc').value = category.description || '';

            showModal('edit-category-modal');
        }

        // Edit category form
        document.getElementById('edit-category-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const categoryId = document.getElementById('edit-category-id').value;
            const data = {
                name: document.getElementById('edit-category-name').value,
                icon: document.getElementById('edit-category-icon').value,
                description: document.getElementById('edit-category-desc').value
            };

            try {
                await api.put(`/admin/categories/${categoryId}`, data);
                showToast('Category updated!', 'success');
                hideModal('edit-category-modal');
                loadCategories();
            } catch (error) {
                showToast(error.message || 'Failed to update category', 'error');
            }
        });

        async function deleteCategory(categoryId) {
            if (!confirm('Delete this category? All quizzes in this category will become uncategorized.')) return;

            try {
                await api.delete(`/admin/categories/${categoryId}`);
                showToast('Category deleted', 'success');
                loadCategories();
            } catch (error) {
                showToast(error.message || 'Failed to delete category', 'error');
            }
        }

        init();
    </script>
</body>

</html>
